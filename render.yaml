services:
  - type: web
    name: cropsphere-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace=@farmdirect/server
    startCommand: npm run start --workspace=@farmdirect/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
